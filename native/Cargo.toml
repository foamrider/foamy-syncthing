[package]
name = "foamy-syncthing-helper"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Conflict scan and native core of Foamy Syncthing; the core is a Rust port of Syncshell's core (MIT)"

[dependencies]
foamy-helper = { path = "../kit/rust/foamy-helper" }
# Snapshots, requests and Syncthing's REST replies.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# poll(2) for idle-connection checks, errno values.
rustix = { version = "1.1", default-features = false, features = ["std", "fs", "process", "event"] }
# HTTPS to the Syncthing GUI. No default features: no aws-lc-rs (C), no logging.
rustls = { version = "0.23.31", default-features = false, features = ["std", "tls12"] }
# rustls crypto in Rust and assembly only, so both musl targets build with
# rustc alone (ring and aws-lc-rs need a C cross-compiler).
rustls-graviola = "0.4"
# The system CA store, only for an explicit HTTPS --endpoint without a pin.
rustls-native-certs = "0.8"
# Syncthing's config.xml (the GUI address, TLS flag and API key).
quick-xml = { version = "0.38", default-features = false }
