# foamy-kit 0.5.0 b55348cdbe6d0e5167b8ce5ea774e7074fc893296c23ad7717d629ec3059f90d — do not edit; change foamy-kit and run sync
# Shared library of the foamy plugin helpers; see src/lib.rs. Vendored into
# plugins as kit/rust/foamy-helper and used by path. The version only changes
# with the public API (a plugin then runs `cargo update -p foamy-helper`), so
# a kit release that leaves this crate alone needs no new plugin Cargo.lock.
[package]
name = "foamy-helper"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Bounded I/O, JSON lines, atomic files, locks and bounded child processes for foamy plugin helpers"

[dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "fs", "process", "event"] }
serde = { version = "1", default-features = false, features = ["std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
